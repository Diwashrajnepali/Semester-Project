{% extends "base.html" %}
{% load static %}

{% block title %}Redirecting to Payment...{% endblock title %}

{% block body %}
<div class="container mt-5 text-center">
    <div class="spinner-border text-primary" role="status">
        <span class="visually-hidden">Loading...</span>
    </div>
    <h3 class="mt-3">Redirecting to eSewa...</h3>
    <p>Please wait while we secure your connection.</p>

    <form action="https://rc-epay.esewa.com.np/api/epay/main/v2/form" method="POST" id="esewaForm">
        <input type="hidden" id="amount" name="amount" value="{{ amount }}" required>
        <input type="hidden" id="tax_amount" name="tax_amount" value="0" required>
        <input type="hidden" id="total_amount" name="total_amount" value="{{ total_amount }}" required>
        <input type="hidden" id="transaction_uuid" name="transaction_uuid" value="{{ transaction_uuid }}" required>
        <input type="hidden" id="product_code" name="product_code" value="EPAYTEST" required>
        <input type="hidden" id="product_service_charge" name="product_service_charge" value="0" required>
        <input type="hidden" id="product_delivery_charge" name="product_delivery_charge" value="0" required>
        <input type="hidden" id="success_url" name="success_url" value="{{ success_url }}" required>
        <input type="hidden" id="failure_url" name="failure_url" value="{{ failure_url }}" required>
        <input type="hidden" id="signed_field_names" name="signed_field_names"
            value="total_amount,transaction_uuid,product_code" required>
        <input type="hidden" id="signature" name="signature" value="{{ signature }}" required>

        <div class="mt-4">
            <button type="submit" class="btn btn-success">Pay with eSewa</button>
        </div>
    </form>
</div>

<script>
    // Auto submit the form to eSewa
    document.addEventListener("DOMContentLoaded", function () {
        setTimeout(function () {
            document.getElementById("esewaForm").submit();
        }, 1000);
    });
</script>
{% endblock body %}
